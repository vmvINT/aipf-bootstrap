name: Windows launcher smoke
on:
  push:
    branches:
      - feature/stage0-preflight-20261117
  pull_request:
  workflow_dispatch:
jobs:
  launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Native Windows PowerShell positional/named argument binding
        shell: powershell
        run: |
          .\tests\test_windows_launcher.ps1
      - name: Validate GitHub repo discovery JSON on native Windows PowerShell
        shell: powershell
        run: |
          .\tests\test_repo_discovery.ps1
      - name: Parse complete first-run PowerShell script and enforce structure
        shell: powershell
        run: |
          .\tests\test_boot_parser.ps1
      - name: Verify F05 LAB upgrade and rollback selection
        shell: powershell
        run: |
          .\tests\test_lab_f05_update.ps1
      - name: Verify Worker distribution pin, exact remote bytes and PowerShell parser
        shell: powershell
        run: |
          .\tests\test_worker_source_pin.ps1
