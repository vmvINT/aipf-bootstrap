name: Verify live Cloudflare Bootstrap matches stable loader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact live public loader and embedded Stage0
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import time
          from urllib.request import urlopen, Request

          reviewed = Path("boot-private.ps1").read_bytes()
          stage0 = Path("cloudflare/stage0-reviewed.ps1").read_bytes()
          if b"releases/twin-stable.json" not in reviewed:
              raise SystemExit("STABLE_RELEASE_POINTER_NOT_IN_REVIEWED_LOADER")
          url = "https://get.sync2.link/?verified_commit=" + os.environ["GITHUB_SHA"][:12]
          ok = False
          for i in range(15):
              try:
                  with urlopen(Request(url, headers={
                      "Cache-Control": "no-cache",
                      "User-Agent": "AIPF-Stable-Verification/1"
                  }), timeout=15) as response:
                      payload = response.read(40000)
                  if payload == reviewed:
                      ok = True
                      print("LIVE_BOOTSTRAP=VERIFIED_EXACT_STABLE_MAIN")
                      print("LIVE_LOADER_SHA256=" + hashlib.sha256(payload).hexdigest())
                      break
                  print("LIVE_BOOTSTRAP=STALE_OR_MISMATCH attempt=" + str(i+1))
              except Exception as e:
                  print("LIVE_BOOTSTRAP=UNREACHABLE attempt=" + str(i+1) +
                        " cause=" + type(e).__name__)
              if i < 14:
                  time.sleep(12)
          if not ok:
              raise SystemExit("LIVE_BOOTSTRAP_NOT_UPDATED_ON_CLOUDFLARE")
          for path, expected in [("/stage0", stage0),
                                 ("/health", b"aipf-bootstrap-endpoint:ok\n")]:
              request = Request("https://get.sync2.link" + path, headers={
                  "Cache-Control": "no-cache",
                  "User-Agent": "AIPF-Stable-Verification/1",
              })
              with urlopen(request, timeout=15) as response:
                  live = response.read(40000)
              if live != expected:
                  raise SystemExit("LIVE_ROUTE_CONTENT_MISMATCH:" + path)
          print("LIVE_STAGE0_AND_HEALTH=PASS")
          PY
